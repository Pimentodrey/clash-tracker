name: Collecte des données Clash Royale

on:
  schedule:
    - cron: "17 * * * *"   # toutes les heures
  workflow_dispatch:        # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Récupérer les données
        env:
          CR_TOKEN: ${{ secrets.CR_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python scripts/collect.py
      - name: Enregistrer
        run: |
          git config user.name "clash-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Données $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase --quiet && git push
